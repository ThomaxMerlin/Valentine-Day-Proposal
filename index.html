<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Will You Be My Valentine?</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="heart"></div>
      <div class="proposal-content">
        <h1>My Dearest...</h1>
        <p class="message">Will you be my Valentine?</p>
        <div class="buttons">
          <button id="yesBtn" class="btn yes-btn">Yes! ❤️</button>
          <button id="noBtn" class="btn no-btn">No 💔</button>
        </div>
        <div id="response" class="response"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
